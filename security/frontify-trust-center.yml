correction:
  applied: '2026-08-13'
  previous_claim: [SOC 2, ISO 27001, ISO 27017, ISO 27018, HIPAA, FedRAMP, GDPR, CSA STAR]
  what_was_wrong: >-
    The previous round credited Frontify with ISO 27017, ISO 27018, FedRAMP and CSA STAR.
    NONE of those belong to Frontify. The trust.frontify.com bootstrap payload also
    embeds OTHER vendors' Conveyor records — Datadog (iso-27017, iso-27018,
    fedramp-li-saas), Splunk (fedramp-moderate, CSA STAR 2) and AWS (fedramp, csa) — and
    a keyword scan of the page body cannot tell whose certification it just matched. The
    earlier artifact matched on the page, not on Frontify's record.
  what_was_missed: >-
    The same error dropped four certifications Frontify genuinely holds — Cyber
    Essentials, TISAX, Swiss-US DPF and PCI — and lost the ISO 27001 vintage (2022).
  rule: >-
    On a shared trust-center platform (Conveyor, SafeBase, Vanta, Drata), match the
    vendor record by its own website/slug field before reading any certification list.
    A keyword hit on the page is not evidence about this company.
