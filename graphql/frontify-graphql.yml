description: >-
  Frontify's public API is a single GraphQL API served per instance at
  https://{instance}.frontify.com/graphql. GraphQL introspection is OPEN and
  UNAUTHENTICATED on every Frontify host probed — an anonymous POST of the
  standard IntrospectionQuery returns the full schema document, while every
  data-bearing field returns a permission error ("UserId not set in identity.").
  The SDL and the raw introspection response saved here are therefore the real,
  provider-served machine-readable contract for this API — the equivalent of an
  OpenAPI document for a REST provider. Frontify publishes no OpenAPI.
