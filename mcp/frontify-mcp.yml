generated: '2026-08-13'
method: probed
status: published
source: >-
  https://mcp.frontify-integrations.com/ (Frontify's own hosted MCP server, with a
  human-readable tool page per pack) + https://github.com/Frontify/mcp-servers
  (Official Frontify MCP Server Resources) + live probes of the endpoint and its
  OAuth discovery documents
description: >-
  Frontify's hosted MCP server connects AI assistants (Claude, ChatGPT, Cursor) directly
  to a Frontify digital asset management (DAM) system — discover brands, search and
  retrieve assets, manage metadata, collaborate, and automate creative workflows through
  natural language. Nothing to install or run; point an MCP client at a pack endpoint and
  authorize. Frontify labels it Beta / experimental and warns explicitly that write
  access carries real risk of irreversible change.
deployment:
  mode: remote
  endpoint: https://mcp.frontify-integrations.com/mcp
  auth: oauth
  verified: probed
  probe:
    checked: '2026-08-13'
    request: 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} with Accept: application/json, text/event-stream'
    http_status: 401
    body: '{"jsonrpc":"2.0","error":{"code":-32001,"message":"Unauthorized: OAuth authentication required"},"id":null}'
    www_authenticate: >-
      Bearer resource_metadata="https://mcp.frontify-integrations.com/.well-known/oauth-protected-resource/mcp",
      scope="mcp:tools"
    result: >-
      LIVE and correctly implementing the MCP 2025-11-25 authorization spec — the 401 is
      a spec-conformant OAuth challenge, not a dead host. It supersedes the earlier
      catalog census entry that recorded this endpoint as `probe: dead` and set
      mode: none; that record was wrong.
  note: >-
    There is NO stdio/npx package — this is a remote-only server. An agent can reach it
    today with an OAuth token; no local install exists.
server:
  name: Frontify MCP Server
  hosted_by: Frontify
  transport: http
  base_url: https://mcp.frontify-integrations.com/
  tool_reference: https://mcp.frontify-integrations.com/
  maturity: beta
  spec_version: '2025-11-25'
  auth:
    type: oauth2
    scope: mcp:tools
    authorization_server: https://mcp.frontify-integrations.com
    authorization_endpoint: https://mcp.frontify-integrations.com/oauth/authorize
    token_endpoint: https://mcp.frontify-integrations.com/oauth/token
    registration_endpoint: https://mcp.frontify-integrations.com/oauth/register
    pkce: S256
    client_registration: [client-id-metadata-document, dynamic-client-registration]
    discovery:
      - well-known/frontify-oauth-authorization-server.json
      - well-known/frontify-oauth-protected-resource.json
      - well-known/frontify-openid-configuration.json
    downstream_scopes: scopes/frontify-scopes.yml
capabilities:
- Brand & structure discovery (brands, libraries, projects)
- Navigation & search across brands/libraries/projects with type filtering
- Asset retrieval, upload & creation (from URL or file upload)
- Organizing assets (tags, targets, custom metadata, collections, folders)
- Comments & collaboration (read/add/reply to comments and annotations)
- Guidelines (brand portals, guideline pages, library page assets)
- Creative templates (list templates, export creatives with variables)
- Workflow automation (tasks, statuses, checklists)
- Brand essentials (color palettes, font families)
packs:
- name: admin
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/admin
  tools: 54
  scopes: [basic:read, basic:write, account:read, blocks:read]
  description: All available tools — full access, no restrictions.
- name: discovery
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/discovery
  tools: 24
  scopes: [basic:read, blocks:read]
  description: Read-only exploration — brands, libraries, projects, assets, guidelines, templates.
- name: collaboration
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/collaboration
  tools: 21
  scopes: [basic:read, basic:write]
  description: Conversational workflows — comments, replies, workflow tasks.
- name: asset-organization
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/asset-organization
  tools: 21
  scopes: [basic:read, basic:write]
  description: Asset structure & hygiene — tags, targets, metadata, collections, folders.
- name: asset-creation
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/asset-creation
  tools: 21
  scopes: [basic:read, basic:write]
  description: Create or import assets — upload, update, tag, metadata, targets.
- name: creative-automation
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/creative-automation
  tools: 19
  scopes: [basic:read, basic:write]
  description: Template-driven automation — list templates, export creatives, upload results.
- name: workflow-automation
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/workflow-automation
  tools: 20
  scopes: [basic:read, basic:write]
  description: Review pipelines — workflow statuses, tasks, comments.
- name: brand-admin
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/brand-admin
  tools: 18
  scopes: [basic:read, basic:write]
  description: Structural management — projects, folders, collections, metadata properties.
- name: brand-portal
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/brand-portal
  tools: 11
  scopes: [basic:read, blocks:read]
  description: Brand portal content — list guidelines, read pages, browse library assets.
- name: bulk-operations
  endpoint: https://mcp.frontify-integrations.com/mcp/packs/bulk-operations
  tools: 15
  scopes: [basic:read, basic:write]
  description: Bulk operations — move assets, update, set metadata, remove targets.
client_config:
  cursor_or_claude_desktop: |
    {
      "mcpServers": {
        "frontify": {
          "url": "https://mcp.frontify-integrations.com/mcp/packs/discovery"
        }
      }
    }
  note: Frontify recommends starting with the read-only `discovery` pack.
tools_note: >-
  The 54 tools below are the `admin` pack (the full set), transcribed verbatim from
  Frontify's own per-pack HTML tool pages — name, annotation (read-only / write /
  destructive) and description. `packs:` lists the other packs each tool appears in.
  INPUT SCHEMAS ARE NOT CAPTURED: tools/list is OAuth-gated (401), so the live
  inputSchema for each tool requires an authenticated introspection. The nearest public
  proxy for each tool's real input contract is its backing GraphQL field — see
  mcp/frontify-tool-crosswalk.yml.
tools:
