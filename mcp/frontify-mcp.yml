    annotation: read-only
    description: "Retrieve the currently authenticated Frontify user's profile information."
    packs: []
  - name: get_collaborators
    annotation: read-only
    description: "List users who have access to a specific library or project with their IDs, names, emails, and roles."
    packs: [discovery, collaboration, workflow-automation, brand-admin]
  - name: list_brands
    annotation: read-only
    description: "List all brands available in the Frontify account with their IDs, names, and visual identities."
    packs: [discovery, collaboration, asset-organization, asset-creation, creative-automation, workflow-automation, brand-admin, brand-portal, bulk-operations]
  - name: get_brand
    annotation: read-only
    description: "Retrieve detailed information about a specific brand including its libraries and projects."
    packs: [discovery, collaboration, asset-organization, asset-creation, creative-automation, workflow-automation, brand-admin, brand-portal, bulk-operations]
  - name: get_library
