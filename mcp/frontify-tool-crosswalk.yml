generated: '2026-08-13'
method: derived
source: >-
  mcp/frontify-mcp.yml (54 tools transcribed from Frontify's own pack pages) bound to
  graphql/frontify.graphql (the live, anonymously-introspected Frontify GraphQL schema)
description: >-
  Binds each tool of Frontify's hosted MCP server to the GraphQL field(s) that back it.
  Frontify publishes no OpenAPI, so the GraphQL schema is the machine-readable core here
  and a tool's real input contract is its backing field's arguments / input object.
  Every GraphQL name in `graphql:` below was grepped out of graphql/frontify.graphql —
  none were invented.
surfaces:
  graphql:
    endpoint: https://{instance}.frontify.com/graphql
    schema: graphql/frontify.graphql
    introspection: open (anonymous), data fields permission-gated
    note: >-
      The introspected slice exposes 13 root queries and 57 root mutations. Frontify's
      own reference (frontify.github.io/graphql-reference) states the full schema has 18
      queries and 102 mutations, so an anonymous caller sees roughly half the mutation
      surface. Tools listed under `not_in_visible_schema[]` are almost certainly backed
      by fields in that hidden remainder — they are NOT evidence of a missing capability.
  mcp:
    endpoint: https://mcp.frontify-integrations.com/mcp
    manifest: mcp/frontify-mcp.yml
    tools_list: gated (HTTP 401, OAuth `mcp:tools` required) — inputSchemas not captured
  openapi:
    present: false
    note: Frontify publishes no OpenAPI/REST contract.
crosswalk:
  - tool: get_current_user
    category: identity
    graphql: [RootQuery.currentUser]
    binding: graphql-query
    confidence: high
  - tool: get_account
