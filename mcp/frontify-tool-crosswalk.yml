    Target, Workflow, ColorPalette, FontFamily or Guideline-listing type or field exists
    in it. They are presumed backed by the ~45 mutations and ~5 queries the public
    introspection does not expose. Recorded here rather than in mcp_only[] because the
    honest statement is "not visible to us", not "not in GraphQL".
