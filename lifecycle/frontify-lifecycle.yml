deprecation:
  policy_url: null
  policy_page_published: false
  mechanism: graphql-field-deprecation-with-explicit-removal-date
  evidence: >-
    63 fields in the live schema carry @deprecated, and EVERY one of them states a
    removal date in its reason string, in a consistent machine-parseable form:
    "This field will be removed. Use `<replacement>` instead. | Date: YYYY-MM-DD".
    Most also name the exact replacement field. This is a real, dated, in-contract
    deprecation practice — stronger than most providers' prose policy pages — even
    though Frontify publishes no separate written deprecation/sunset policy document.
  sunset_header: false
  sunset_header_note: RFC 8594 Sunset/Deprecation HTTP headers are not used (GraphQL is a single endpoint).
  deprecated_field_count: 63
  removal_dates:
    '2023-01-01': 2
    '2024-01-01': 6
    '2024-07-01': 6
    '2025-07-01': 6
    '2026-07-01': 41
    '2027-01-01': 2
  overdue_note: >-
    61 of the 63 fields are already past their own stated removal date as of 2026-08-13
    and are still being served — including RootQuery.project and Brand.projects, dated
    2023-01-01, and the entire 41-field metadata migration dated 2026-07-01. Only the two
    CreativeTemplate fields dated 2027-01-01 are still in the future. Frontify announces
    removal dates reliably and enforces them loosely: read a Frontify removal date as
    "stop using by", not "will break on". Integrators are not being cut off, but the
    dates have lost their signalling value and a written deprecation policy stating the
    actual removal practice would be worth more than the dates alone.
