notes: >-
  Frontify's SDK surface is client-side / app-integration oriented (Brand SDK, App
  Bridge, Finder, Authenticator, Fondue design system) rather than a traditional
  server-side API client. The public API is GraphQL and is called directly — there is NO
  first-party GraphQL client, and no Python/Go/Ruby/PHP/Java/.NET server SDK on any
  public registry. A team integrating Frontify server-side writes raw GraphQL against
  graphql/frontify.graphql. Community-published alternatives exist (e.g. `ffy-api-cli`,
  "Agent-friendly CLI for the Frontify GraphQL API", authored by a Frontify employee but
  outside the @frontify scope) and are not treated as first-party here.
