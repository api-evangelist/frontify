source: graphql/frontify.graphql
description: >-
  Entity-relationship graph of the Frontify API, derived from the live GraphQL schema.
  Every type, field and cardinality below was read out of graphql/frontify.graphql —
  nothing is inferred from marketing copy. Cardinality is read from the schema shape: a
  field returning a `*Items` wrapper (total/page/limit/hasNextPage/items) or a list is
  has_many; a field returning a single object type is has_one.
identity:
  scheme: opaque-graphql-global-id
  interface: Node
  field: id (ID!)
  resolver: RootQuery.node(id) -> Node
  note: >-
    Frontify uses opaque global IDs on a `Node` interface — there are no Stripe-style
    typed id prefixes, so an id string does not tell you what it points at. 23 types
    implement Node.
  external_ids:
    field: Asset.externalId
    lookup: Library.assetsByExternalId(externalId, limit, cursor)
    note: >-
      The one place a caller's own identifier can be attached to a Frontify object and
      looked up again — the integration key for syncing a DAM with an external system.
interfaces:
  - name: Node
    role: global identity
    implementors: 23
  - name: Asset
    role: the central content entity
    implementors: [Image, Video, Audio, Document, File, EmbeddedContent]
    note: >-
      Asset is polymorphic. Every concrete asset type carries the same core fields
      (title, description, alternativeText, tags, copyright, availability, expiresAt,
      status, creator/modifier, attachments, relatedAssets, customMetadata) plus
      type-specific fields. Agents must handle all six __typename values.
  - name: Library
    role: the container that holds assets
    implementors: [MediaLibrary, LogoLibrary, IconLibrary, DocumentLibrary]
    note: A Brand's libraries are typed by content class, not configured generically.
  - name: Folder
    role: hierarchical placement within a library or workspace
    implementors: [SubFolder, LibraryRootFolder, WorkspaceRootFolder]
  - name: User
    role: actor
    implementors: [AccountUser, and collaborator user projections]
  - name: Webhook
    role: event subscription
    implementors: [ProjectWebhook]
entities:
  - name: Account
    root_query: RootQuery.account
    summary: The Frontify tenant. Holds users and user groups.
  - name: Brand
    root_query: [RootQuery.brand, RootQuery.brands]
    summary: A brand within the account — the top of the content hierarchy.
  - name: Library
    summary: Typed asset container (media / logo / icon / document) belonging to a brand.
  - name: Workspace
    root_query: RootQuery.workspaceProject
    summary: >-
      Project-style container (the successor to the deprecated `Project`). Holds assets,
      folders, collaborators and licenses.
  - name: Asset
    root_query: [RootQuery.asset, RootQuery.assets]
    summary: The unit of content — image, video, audio, document, file or embedded content.
  - name: Collection
    summary: Virtual grouping of assets inside a library; does not move the originals.
  - name: AssetComment
    summary: Comment or visual annotation on an asset, with threaded replies and OPEN/RESOLVED status.
  - name: CustomMetadataProperty
    summary: >-
      Tenant-defined metadata schema attached to a library, workspace or brand. Replaces
      the deprecated MetadataField family (removal date 2026-07-01).
  - name: Guideline
    summary: A brand portal / guideline document, composed of LibraryPage pages.
  - name: CreativeTemplate
    root_query: RootQuery.creativeTemplate
    summary: A parameterised design template that can be exported with variable values.
  - name: CreativeExport
    root_query: RootQuery.creativeExport
    summary: An asynchronous render job produced from a CreativeTemplate.
  - name: ProjectWebhook
    root_query: RootQuery.webhooks
    summary: Event subscription on a project, with a secret and a subscribeTo event list.
  - name: License
    summary: Usage license attachable to assets.
  - name: UserGroup
    summary: Account-level grouping of users.
