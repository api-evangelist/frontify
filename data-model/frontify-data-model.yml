deprecation_pressure:
  note: >-
    The metadata subsystem is mid-migration and the whole MetadataField / MetadataValue
    family is dated for removal 2026-07-01 in favour of CustomMetadataProperty /
    customMetadata. `Project` -> `Library`/`Workspace` has been dated for removal since
    2023-01-01 and is still in the schema. Any data model built against Frontify should
    target the CustomMetadata* types. See lifecycle/frontify-lifecycle.yml.
