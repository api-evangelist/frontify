  configure: RootMutation.configureProjectWebhook(ConfigureProjectWebhookInput) -> ConfigureProjectWebhook
  uninstall: RootMutation.uninstallWebhook(UninstallWebhookInput) -> UninstallWebhook
  scopes: [webhooks:read, webhooks:write, basic:write]
  scopes_confidence: medium
