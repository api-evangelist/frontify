description: >-
  Frontify has a real, first-class event surface: project-scoped webhooks with a
  24-value event vocabulary, a per-webhook shared secret for signature verification, and
  two payload versions. Frontify publishes NO AsyncAPI document — this catalogue is
  derived field-for-field from the live GraphQL schema, which is where the event
  vocabulary is actually declared. Nothing here was authored; every event name is an
  enum value in graphql/frontify.graphql.
webhook_model:
  scope: project
  note: >-
    Webhooks are installed on a Frontify project. Each webhook has an id, name,
    notificationUrl, creator, createdAt and a randomly generated `secret`.
  delivery: HTTP POST to the subscriber-supplied notificationUrl
  payload_versions: [1, 2]
  payload_version_note: >-
    ConfigureProjectWebhookInput.version is a required Int documented in the schema as
    "Webhook payload version (1 or 2)" — an explicit, in-contract payload versioning
    mechanism.
  subscription: >-
    ConfigureProjectWebhookInput.subscribeTo is [AssetWebhookEvent!]. The schema states:
    "Subscribe to specific webhook events. If not defined the webhook will subscribe to
    all events" — i.e. subscribe-to-everything is the default.
  signature:
    present: true
    field: secret
    schema_description: The randomly generated secret of the current `Webhook`.
    note: >-
      Frontify signs deliveries; a receiver must verify the signature against the
      webhook secret. Third-party connector documentation notes that replaying a sample
      will not validate because only events genuinely sent by Frontify carry a valid
      event signature. The exact header name and signing algorithm are documented on the
      JS-rendered webhooks page and were NOT captured verbatim in this pass.
