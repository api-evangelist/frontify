  grepped out of graphql/frontify.graphql. Frontify publishes no API-operation skills of
  its own, which is why the second set exists.

# --- Frontify's own published catalogue (verbatim, method: searched) ---
provider_catalogue_description: >-
  Frontify publishes an official, curated Agent Skills catalog in the
  Frontify/skills GitHub repository. Each skill is a self-contained SKILL.md
  (with optional references/, scripts/, assets/) conforming to the open Agent
  Skills spec (agentskills.io) and installable into any compatible agent
  (Claude Code, Cursor, Codex, OpenCode, Gemini CLI) with a single
  `npx skills add Frontify/skills --skill <name>` invocation. Skills resolve
  project-specific values via an AGENTS.md contract in the consuming repo.
  These are engineering-workflow skills (spec / fix / audit / migration writers
  plus reviewer personas), not GraphQL-API-operation skills; captured verbatim
  as the provider's published agent-skill surface.
install: npx skills add Frontify/skills --skill <skill-name>
