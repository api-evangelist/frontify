# --- API Evangelist generated, grounded in graphql/frontify.graphql (method: generated) ---
api_skills_method: generated
api_skills_source: graphql/frontify.graphql
api_skills_note: >-
  One skill per marquee Frontify flow. Every GraphQL query, mutation, input object and enum
  value referenced was verified against the live introspected schema before being written;
  none were invented. Where a fact was not verifiable (webhook signature header name,
  complexity budget), the skill says so rather than guessing.
api_skills:
  - file: frontify-search-and-retrieve-assets.md
    name: Search and retrieve Frontify assets
    api: graphql/frontify.graphql
    operations: [brands, brand, library, workspaceProject, assets, asset, assetsByExternalId]
  - file: frontify-upload-asset.md
    name: Upload an asset to Frontify
    api: graphql/frontify.graphql
    operations: [uploadFile, createAsset, replaceAsset, addAssetTags, addCustomMetadata, assetsByExternalId]
  - file: frontify-export-creative-template.md
    name: Export a creative from a Frontify template
    api: graphql/frontify.graphql
    operations: [creativeTemplates, creativeTemplate, exportCreative, creativeExport, cancelExportCreatives]
  - file: frontify-subscribe-to-events.md
    name: Subscribe to Frontify events with a webhook
    api: graphql/frontify.graphql
    operations: [installProjectWebhook, configureProjectWebhook, webhooks, uninstallWebhook]
