aid: frontify
name: Frontify
description: >-
  Frontify is a brand management and digital asset management (DAM) platform that
  gives teams a single, governed home for brand guidelines, logos, images, video,
  templates, and creative workflows. Its public developer surface is a per-instance
  GraphQL API (https://{instance}.frontify.com/graphql) for discovering brands,
  searching and retrieving assets, managing metadata, collaborating, browsing
  guidelines, exporting creative templates, and automating creative workflows, plus
  a Brand SDK (App Bridge, Frontify Finder, Frontify CLI) for building Content Blocks
  and Platform Apps, an official hosted MCP server for AI assistants, and a curated
  Agent Skills catalog. Frontify was added to the API Evangelist network as a
  portfolio company of EQT Ventures and enriched here from its public developer,
  package, and trust surfaces.
