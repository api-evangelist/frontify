aid: frontify
name: Frontify
description: >-
  Frontify is a brand management and digital asset management (DAM) platform that
  gives teams a single, governed home for brand guidelines, logos, images, video,
  templates, and creative workflows. Its public developer surface is a per-instance
  GraphQL API (https://{instance}.frontify.com/graphql) for discovering brands,
  searching and retrieving assets, managing metadata, collaborating, browsing
  guidelines, exporting creative templates, and automating creative workflows, plus
  a Brand SDK (App Bridge, Frontify Finder, Frontify CLI) for building Content Blocks
  and Platform Apps, project-scoped webhooks across a 24-event vocabulary, an official
  hosted MCP server (54 tools in 10 role-scoped packs) for AI assistants, and a curated
  Agent Skills catalog. GraphQL introspection is open and unauthenticated, so the full
  schema is captured in this repository as the machine-readable contract; Frontify
  publishes no OpenAPI. Frontify was added to the API Evangelist network as a portfolio
  company of EQT Ventures and enriched here from its public developer, package, event,
  and trust surfaces.
